name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit on main; refusing to release."
            exit 1
          fi

      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a plain major.minor.patch version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/main.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release
          (cd artifacts/neoretro-windows-x64 && zip -qr "$GITHUB_WORKSPACE/release/neoretro-$VERSION-windows-x64.zip" .)
          for arch in x64 arm64; do
            cp "artifacts/neoretro-linux-$arch/neoretro.appimage" "release/neoretro-$VERSION-linux-$arch.AppImage"
          done
          cp artifacts/neoretro-mac-universal/neoretro.dmg "release/neoretro-$VERSION-mac-universal.dmg"
          cp artifacts/neoretro-mac-universal/neoretro-mac.zip "release/neoretro-$VERSION-mac-universal.zip"
          ls -la release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "neoretro $VERSION" \
            --generate-notes

      - name: Publish update feed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          asset() {
            jq -n --arg url "$base/$2" --arg sha "$(sha256sum "release/$2" | cut -d' ' -f1)" \
              '{($ARGS.positional[0]): {url: $url, sha256: $sha}}' --args "$1"
          }
          notes="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          {
            asset windows-x64 "neoretro-$VERSION-windows-x64.zip"
            asset mac-universal "neoretro-$VERSION-mac-universal.zip"
            asset linux-x64 "neoretro-$VERSION-linux-x64.AppImage"
            asset linux-arm64 "neoretro-$VERSION-linux-arm64.AppImage"
          } | jq -s --arg version "$VERSION" --arg notes "$notes" \
            '{version: $version, notes: $notes, assets: add}' > appcast.json
          cat appcast.json
          gh release upload "v$VERSION" appcast.json --repo "$GITHUB_REPOSITORY"
