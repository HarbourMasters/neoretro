name: Linux Validation

on:
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update machine
        run: sudo apt update
      - name: Install dependencies
        run: sudo apt-get install -y gcc g++ git cmake ninja-build lsb-release file libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols libgtk-3-dev libcurl4-openssl-dev
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          key: linux-${{ matrix.arch }}-deps-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          path: build-cmake/_deps
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          max-size: 2G
          save: ${{ github.ref_name == github.event.repository.default_branch }}
          key: linux-validation-${{ matrix.arch }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            linux-validation-${{ matrix.arch }}-ccache-${{ github.ref }}
            linux-validation-${{ matrix.arch }}-ccache-
      - name: Build
        run: |
          cmake -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE=Release -D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-cmake -j
      - name: Test
        run: ./build-cmake/neoretro-tests
      - name: Create Package
        run: |
          mkdir neoretro-release
          mv build-cmake/neoretro neoretro-release/
          cp -R build-cmake/assets neoretro-release/assets
      - name: Publish packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neoretro-linux-${{ matrix.arch }}
          path: neoretro-release
          retention-days: 1
