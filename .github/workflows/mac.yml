name: MacOS Validation
on: [pull_request]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: brew install ninja
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          key: mac-universal-deps-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          path: build-cmake/_deps
      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          save: ${{ github.ref_name == github.event.repository.default_branch }}
          key: ${{ runner.os }}-universal-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-universal-ccache-${{ github.ref }}
            ${{ runner.os }}-universal-ccache
      - name: Build (Universal)
        run: |
          cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-cmake --config Release --parallel 10
      - name: Test
        run: |
          lipo -info build-cmake/neoretro
          ./build-cmake/neoretro-tests
          if arch -x86_64 /usr/bin/true 2>/dev/null; then arch -x86_64 ./build-cmake/neoretro-tests; fi
      - name: Create Package
        run: |
          mkdir neoretro-release
          mv build-cmake/neoretro neoretro-release/
          cp -R build-cmake/assets neoretro-release/assets
      - name: Publish packaged artifacts
        uses: actions/upload-artifact@v4
        with:
            name: neoretro-mac-universal
            path: neoretro-release
            retention-days: 1
